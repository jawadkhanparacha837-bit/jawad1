<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medi Nova AI</title>
    <meta name="description" content="Bilingual AI health information & healthcare navigation platform for Pakistan featuring OpenStreetMap Healthcare Finder, Medicine Guide, Test Guide, and Health Library." />
    <meta property="og:title" content="Medi Nova AI" />
    <meta property="og:description" content="Bilingual AI health information & healthcare navigation platform for Pakistan featuring OpenStreetMap Healthcare Finder, Medicine Guide, Test Guide, and Health Library." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Fonts for English and Urdu typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var savedAppearance = localStorage.getItem('medinova-appearance') || localStorage.getItem('medinova-theme') || 'system';
          var savedAccent = localStorage.getItem('medinova-accent') || 'default';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolvedTheme = (savedAppearance === 'dark' || savedAppearance === 'light')
            ? savedAppearance
            : (prefersDark ? 'dark' : 'light');

          var root = document.documentElement;
          if (resolvedTheme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          root.setAttribute('data-theme', resolvedTheme);
          root.setAttribute('data-appearance', savedAppearance);
          root.setAttribute('data-accent', savedAccent);
          root.style.colorScheme = resolvedTheme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-cyan-100 selection:text-cyan-900 dark:selection:bg-cyan-900 dark:selection:text-cyan-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
